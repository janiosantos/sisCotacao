# Rotas atendidas pelo BACKEND (Flask) — arquivo ÚNICO compartilhado entre
# dev e prod, incluído dentro do server{} de cada nginx.conf:
#   include /etc/nginx/snippets/backend-routes.conf;
# Qualquer rota nova do Flask fora da SPA entra AQUI (nos dois ambientes).

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Falha rápido com backend morto (padrão 60s atrasava a detecção
    # de manutenção no frontend).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
}

location /images/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Páginas renderizadas pelo Flask, FORA da SPA:
location /compras/pedidos/ {
