server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Rotas do backend — arquivo ÚNICO compartilhado com o ambiente local
    # (montado em /etc/nginx/snippets/ pelo Dockerfile.prod e pelo compose local).
    include /etc/nginx/snippets/backend-routes.conf;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
