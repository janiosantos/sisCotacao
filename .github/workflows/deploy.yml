name: Deploy produção (siscom)
run-name: Produção - promove RC aprovada mais recente

# Publicação SOMENTE mediante autorização explícita (Run workflow), usando uma
# tag candidata criada após o staging completo. Não há gatilho automático por tag.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# O runner e o daemon Docker sao compartilhados com staging. Serializar os
# workflows protege build, tagging, migracao e limpeza de cache.
concurrency:
  group: siscom-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Executa no self-hosted runner instalado no próprio servidor de produção.
    runs-on: [self-hosted, siscom-prod]
    environment:
      name: production
      url: https://siscom.casalm.com.br:6173
    env:
      COMPOSE_PROJECT_NAME: siscom   # mantém o volume siscom_postgres-data (dados intactos)
      # Credenciais exigidas pelo docker-compose.prod.yml (senha do volume atual = catalog).
      # Configure em Settings → Secrets: POSTGRES_USER=catalog, POSTGRES_PASSWORD=catalog,
      # CATALOG_SECRET=<segredo aleatório>. Sem CATALOG_SECRET o deploy falha (fail-safe).
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CATALOG_SECRET: ${{ secrets.CATALOG_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Seleciona automaticamente a candidata aprovada mais recente
        id: candidate
        run: |
          RC_TAG="$(python scripts/release_control.py candidate)"
          git checkout --detach "$RC_TAG"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "Candidata selecionada automaticamente: $RC_TAG"

      - name: Valida tag candidata e manifesto
        id: release
        env:
          RC_TAG: ${{ steps.candidate.outputs.rc_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "ERRO: execute o workflow de produção usando 'Use workflow from: main'."
            exit 1
          fi
          if [[ ! "$RC_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERRO: a candidata selecionada não segue vX.Y.Z-rc.RUN_ID.TENTATIVA."
            exit 1
          fi
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          STAGING_RUN_ID="${BASH_REMATCH[2]}"
          STAGING_RUN_ATTEMPT="${BASH_REMATCH[3]}"
          if [ "$(git cat-file -t "refs/tags/$RC_TAG" 2>/dev/null || true)" != "tag" ]; then
            echo "ERRO: $RC_TAG não é uma tag anotada válida."
            exit 1
          fi
          CANDIDATE_SHA="$(git rev-list -n 1 "$RC_TAG")"
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]; then
            echo "ERRO: checkout não corresponde ao commit da tag candidata."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
            echo "ERRO: o commit candidato ainda não pertence ao histórico de main."
            echo "Faça o merge e execute novamente o staging completo a partir de main."
            exit 1
          fi
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$RC_TAG")"
          TAG_RUN_ID="$(printf '%s\n' "$TAG_MESSAGE" | sed -n 's/^staging_run_id=//p')"
          TAG_RUN_ATTEMPT="$(printf '%s\n' "$TAG_MESSAGE" | sed -n 's/^staging_run_attempt=//p')"
          if [ "$TAG_RUN_ID" != "$STAGING_RUN_ID" ] || [ "$TAG_RUN_ATTEMPT" != "$STAGING_RUN_ATTEMPT" ]; then
            echo "ERRO: metadados da tag candidata não correspondem ao run informado no nome."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "ERRO: a versão final $RELEASE_VERSION já foi publicada."
            exit 1
          fi

          export RELEASE_VERSION
          python - <<'PY'
          import json
          import os
          import pathlib

          version = os.environ["RELEASE_VERSION"]
          path = pathlib.Path("releases") / f"{version}.json"
          if not path.is_file():
              raise SystemExit(f"ERRO: manifesto obrigatório não encontrado: {path}")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("versao") != version:
              raise SystemExit(f"ERRO: manifesto declara {data.get('versao')!r}, esperado {version!r}")
          components = data.get("componentes")
          if not isinstance(components, list) or not components:
              raise SystemExit("ERRO: manifesto deve declarar ao menos um componente")
          allowed = {"backend", "frontend", "schema", "deployment"}
          unknown = sorted(set(components) - allowed)
          if unknown:
              raise SystemExit(f"ERRO: componentes sem deploy neste pipeline: {', '.join(unknown)}")
          selected = set(components)
          backend = bool(selected & {"backend", "schema", "deployment"})
          frontend = bool(selected & {"frontend", "deployment"})
          migrations = bool(selected & {"backend", "schema", "deployment"})
          images = data.get("imagens") or {}
          if backend and images.get("backend") != f"siscom-backend:{version}":
              raise SystemExit("ERRO: tag da imagem backend no manifesto não corresponde à versão")
          if frontend and images.get("frontend") != f"siscom-frontend:{version}":
              raise SystemExit("ERRO: tag da imagem frontend no manifesto não corresponde à versão")
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"componentes={','.join(components)}\n")
              stream.write(f"backend={str(backend).lower()}\n")
              stream.write(f"frontend={str(frontend).lower()}\n")
              stream.write(f"migracoes={str(migrations).lower()}\n")
          PY

          {
            echo "release_version=$RELEASE_VERSION"
            echo "rc_tag=$RC_TAG"
            echo "staging_run_id=$STAGING_RUN_ID"
            echo "staging_run_attempt=$STAGING_RUN_ATTEMPT"
            echo "sha=$CANDIDATE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Confirma aprovação do mesmo commit no staging completo
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.sha }}
          STAGING_RUN_ID: ${{ steps.release.outputs.staging_run_id }}
          STAGING_RUN_ATTEMPT: ${{ steps.release.outputs.staging_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          run_id = os.environ["STAGING_RUN_ID"]
          request = urllib.request.Request(
              f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              run = json.load(response)
          workflow_path = str(run.get("path") or "").split("@", 1)[0]
          if workflow_path != ".github/workflows/deploy-staging.yml":
              raise SystemExit(f"ERRO: run {run_id} não pertence ao workflow de staging")
          if run.get("event") != "workflow_dispatch" or run.get("conclusion") != "success":
              raise SystemExit(f"ERRO: run {run_id} não é um staging manual concluído com sucesso")
          if int(run.get("run_attempt") or 0) != int(os.environ["STAGING_RUN_ATTEMPT"]):
              raise SystemExit(f"ERRO: tentativa aprovada do run {run_id} não corresponde à tag candidata")
          if run.get("head_sha") != os.environ["CANDIDATE_SHA"]:
              raise SystemExit(
                  f"ERRO: SHA do staging ({run.get('head_sha')}) difere da candidata "
                  f"({os.environ['CANDIDATE_SHA']})"
              )
          print(f"Staging {run_id} confirmado para o SHA {run['head_sha']}")
          PY

      - name: Preflight de espaco do Docker
        run: |
          # Nao remove containers, volumes ou imagens versionadas.
          docker builder prune --all --force --filter 'until=24h'
          docker image prune --force
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            docker builder prune --all --force
            DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          fi
          df -h "$DOCKER_ROOT"
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            echo "ERRO: menos de 4 GiB livres no filesystem do Docker."
            exit 1
          fi
          docker compose -f deployment/compose/docker-compose.prod.yml config --quiet

      - name: Salva imagem atual (para rollback)
        run: |
          if [ "${{ steps.release.outputs.backend }}" = "true" ]; then
            docker tag siscom-backend:latest siscom-backend:prev || true
          fi
          if [ "${{ steps.release.outputs.frontend }}" = "true" ]; then
            docker tag siscom-frontend:latest siscom-frontend:prev || true
          fi

      - name: Promove as mesmas imagens aprovadas no staging
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
        run: |
          TAG_MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/$RC_TAG")"
          EXPECTED_BACKEND="$(printf '%s\n' "$TAG_MESSAGE" | sed -n 's/^backend_image=//p')"
          EXPECTED_FRONTEND="$(printf '%s\n' "$TAG_MESSAGE" | sed -n 's/^frontend_image=//p')"
          ACTUAL_BACKEND="$(docker image inspect --format '{{.Id}}' "siscom-backend-staging:$RC_TAG")"
          ACTUAL_FRONTEND="$(docker image inspect --format '{{.Id}}' "siscom-frontend-staging:$RC_TAG")"
          if [ -z "$EXPECTED_BACKEND" ] || [ "$EXPECTED_BACKEND" != "$ACTUAL_BACKEND" ]; then
            echo "ERRO: ID da imagem backend difere da candidata aprovada."
            exit 1
          fi
          if [ -z "$EXPECTED_FRONTEND" ] || [ "$EXPECTED_FRONTEND" != "$ACTUAL_FRONTEND" ]; then
            echo "ERRO: ID da imagem frontend difere da candidata aprovada."
            exit 1
          fi
          if [ "${{ steps.release.outputs.backend }}" = "true" ]; then
            docker tag "siscom-backend-staging:$RC_TAG" "siscom-backend:$APP_VERSION"
          else
            docker tag siscom-backend:latest "siscom-backend:$APP_VERSION"
          fi
          if [ "${{ steps.release.outputs.frontend }}" = "true" ]; then
            docker tag "siscom-frontend-staging:$RC_TAG" "siscom-frontend:$APP_VERSION"
          else
            docker tag siscom-frontend:latest "siscom-frontend:$APP_VERSION"
          fi

      - name: Backup de segurança (somente se houver migration pendente)
        if: steps.release.outputs.migracoes == 'true'
        run: |
          mkdir -p /home/jpsantos/siscom/backups
          # A checagem usa a imagem NOVA, pois a imagem atualmente em execucao
          # ainda nao conhece as migrations desta release.
          PENDING=$(docker compose -f deployment/compose/docker-compose.prod.yml run --rm --no-deps backend \
                      python -m migrations check 2>/dev/null \
                      | sed -n 's/.*pendentes: \([0-9]*\).*/\1/p')
          if [ -z "$PENDING" ]; then
            echo "ERRO: nao foi possivel determinar as migrations pendentes."
            exit 1
          fi
          echo "migrações pendentes: $PENDING"
          if [ "$PENDING" != "0" ]; then
            docker compose -f deployment/compose/docker-compose.prod.yml exec -T db \
              pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB:-catalog}" -Fc \
              > "/home/jpsantos/siscom/backups/prod-pre-$(date +%Y%m%d-%H%M%S).dump"
            echo "backup de segurança criado em /home/jpsantos/siscom/backups/"
          else
            echo "sem migrations pendentes; pulando backup"
          fi

      - name: Etiqueta imagens com a versão da release
        run: |
          docker tag "siscom-backend:$APP_VERSION" siscom-backend:latest
          docker tag "siscom-frontend:$APP_VERSION" siscom-frontend:latest

      - name: Para o backend (janela de manutenção — DDL sem tráfego)
        if: steps.release.outputs.migracoes == 'true'
        run: docker compose -f deployment/compose/docker-compose.prod.yml stop backend worker scheduler impressao-worker

      - name: Aplica migrações pendentes (container one-off com a imagem nova)
        if: steps.release.outputs.migracoes == 'true'
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml run --rm --no-deps backend \
            python -m catalog_server.versioning apply --origem deploy

      - name: Deploy (sobe containers)
        run: docker compose -f deployment/compose/docker-compose.prod.yml up -d

      - name: Health gate - migrações + backend
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml exec -T backend \
            python -m migrations status
          for i in $(seq 1 30); do
            if curl -ksfSL https://localhost/api/health >/dev/null 2>&1 \
               || curl -ksfSL http://localhost/api/health >/dev/null 2>&1; then
              echo "backend OK"; exit 0
            fi
            sleep 3
          done
          echo "backend não subiu após deploy"; \
            docker compose -f deployment/compose/docker-compose.prod.yml logs backend; exit 1

      - name: Health gate - worker de impressão
        run: |
          for i in $(seq 1 10); do
            if docker compose -f deployment/compose/docker-compose.prod.yml exec -T impressao-worker python -c \
              "from catalog_server.services.impressao import impressao_service; impressao_service.status(); print('impressao-worker OK')"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deployment/compose/docker-compose.prod.yml ps impressao-worker
          docker compose -f deployment/compose/docker-compose.prod.yml logs --tail=100 impressao-worker
          exit 1

      # Regra 12: smoke pós-deploy — falha em qualquer checagem falha o deploy.
      - name: Smoke tests
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: bash deployment/scripts/smoke.sh http://localhost

      # Toda publicação gera registro no Histórico — independe do componente.
      # Manifestos cujos componentes estão contidos no escopo publicado fecham.
      - name: Registra releases publicadas (histórico)
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml exec -T backend \
            python -m catalog_server.versioning publicar \
            --componentes "${{ steps.release.outputs.componentes }}" \
            --versao "$APP_VERSION"

      - name: Publica tag final somente após os gates
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
        run: |
          git config user.name "siscom-release-bot"
          git config user.email "siscom-release-bot@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" "${{ steps.release.outputs.sha }}" \
            -m "Release $RELEASE_VERSION promovida de $RC_TAG"
          git push origin "refs/tags/$RELEASE_VERSION"
          docker image rm "siscom-backend-staging:$RC_TAG" >/dev/null 2>&1 || true
          docker image rm "siscom-frontend-staging:$RC_TAG" >/dev/null 2>&1 || true
          {
            echo "## Produção publicada"
            echo ""
            echo "- **Versão:** \`$RELEASE_VERSION\`"
            echo "- **Candidata:** \`$RC_TAG\`"
            echo "- **Commit:** \`${{ steps.release.outputs.sha }}\`"
            echo "- **Componentes:** \`${{ steps.release.outputs.componentes }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpa imagens órfãs
        if: always()
        run: docker image prune -f || true
