services:
  backend:
    build:
      context: .
      dockerfile: catalog_server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - server-data:/app/catalog_server/data
      - ./database:/app/database
      - ./images:/app/images
    environment:
      - SYSTEM_DB=/app/catalog_server/data/server.db
      - CACHE_DB=/app/database/server_cache.db
      - IMAGES_DIR=/app/images
      - CATALOG_HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  server-data:
