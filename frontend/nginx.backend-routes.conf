# Rotas atendidas pelo BACKEND (Flask) — arquivo ÚNICO compartilhado entre
# dev e prod, incluído dentro do server{} de cada nginx.conf:
#   include /etc/nginx/snippets/backend-routes.conf;
# Qualquer rota nova do Flask fora da SPA entra AQUI (nos dois ambientes).

# Resolve o backend via DNS do Docker (127.0.0.11) em TEMPO DE REQUISIÇÃO —
# o nginx NÃO falha no startup se o backend ainda não estiver resolvível
# (evita "host not found in upstream 'backend'" e crash-loop).
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8000;
set $gallery_upstream http://siscom-galeria-produtos:8091;

location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Falha rápido com backend morto (padrão 60s atrasava a detecção
    # de manutenção no frontend).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
}

location /images/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Aplicacao independente com o acervo preservado do catalogo anterior.
# O container participa da rede do SISCOM, mas codigo e dados vivem em
# /home/jpsantos/galeria-produtos, fora do checkout da aplicacao.
location /galeria/ {
    proxy_pass $gallery_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}

# Páginas renderizadas pelo Flask, FORA da SPA:
location /compras/pedidos/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

location /orcamentos/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Relatórios são páginas HTML renderizadas pelo Flask para impressão/PDF.
# Sem este bloco, a nova janela cai no fallback da SPA/Vite e aparenta
# deslogar o usuário, mesmo quando a sessão continua válida.
location /relatorios/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
}

# Portal do fornecedor (link enviado por WhatsApp/e-mail)
location /fornecedor/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
}

# Etiquetas são renderizadas pelo Flask e não pela SPA.
location /etiquetas/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
