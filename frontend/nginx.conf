# PRODUÇÃO — HTTPS (Let's Encrypt via DNS-01, atrás de CGNAT).
# Certificados em /etc/letsencrypt/live/siscom.casalm.com.br/ (volume certbot-etc).
# Usado pelo nginx-entrypoint.sh quando o certificado existe.

# HTTP: desafio ACME (fallback) e redireciona o resto para HTTPS.
server {
    listen 80;
    server_name siscom.casalm.com.br _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: aplicação.
server {
    listen 443 ssl default_server;
    server_name siscom.casalm.com.br;

    ssl_certificate     /etc/letsencrypt/live/siscom.casalm.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siscom.casalm.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Rotas do backend — arquivo ÚNICO compartilhado com o ambiente local
    # (montado em /etc/nginx/snippets/ pelo Dockerfile.prod e pelo compose local).
    include /etc/nginx/snippets/backend-routes.conf;

    # Assets com hash no nome (Vite): imutável é seguro — conteúdo novo = nome novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html e fallback da SPA: SEMPRE revalidam.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}