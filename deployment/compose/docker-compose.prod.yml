services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalog
      - POSTGRES_DB=catalog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: siscom-backend:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    # Apenas na rede Docker: o frontend (nginx) alcança backend:8000.
    # Não expõe a porta no host — o acesso externo entra via proxy (:80/:6173).
    expose:
      - "8000"
    volumes:
      - /home/jpsantos/siscom/img:/app/images
      # Manifestos de release direto do checkout do runner — publicações
      # frontend/schema-only registram no Histórico sem rebuild do backend.
      - ../../releases:/app/releases:ro
    environment:
      - IMAGES_DIR=/app/images
      - CATALOG_HOST=0.0.0.0
      - APP_VERSION=${APP_VERSION:-dev}
      # Links de convite ao fornecedor usam DETECÇÃO DINÂMICA da URL externa
      # acessada (Host header / X-Forwarded-*). PUBLIC_BASE_URL é override
      # explícito, opcional — use apenas se o comprador acessa pela LAN e os
      # fornecedores pela porta pública (ex.: redirecionamento de porta/CGNAT):
      #   - PUBLIC_BASE_URL=https://siscom.casalm.com.br:6173
      # Migrações são aplicadas em passo explícito do pipeline (deploy.yml),
      # fora do processo web — evita crash-loop se uma migração falhar.
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; req=urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0 if req.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: siscom-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificados Let's Encrypt (emitidos pelo serviço certbot) + webroot ACME.
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      - DOMAIN=siscom.casalm.com.br
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --no-check-certificate https://127.0.0.1/ -T 5 2>/dev/null || wget -qO /dev/null http://127.0.0.1/ -T 5 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Let's Encrypt — desafio DNS-01 via Cloudflare (funciona atrás de CGNAT,
  # sem precisar abrir portas 80/443). Emite na 1ª subida e renova a cada 12h.
  # Pré-requisito: criar deployment/certbot/cloudflare.ini com o token da API
  # (permissão Zone:DNS:Edit) e chmod 600. Ver cloudflare.ini.example.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # Credencial do Cloudflare FORA do workspace do runner (o checkout limpa
      # arquivos não versionados). Crie /home/jpsantos/siscom/certbot/cloudflare.ini
      # (ver cloudflare.ini.example). Montagem de DIRETÓRIO evita o erro
      # "mount a directory onto a file" quando o arquivo ainda não existe.
      - /home/jpsantos/siscom/certbot:/etc/cloudflare:ro
    environment:
      # Domínio/email FIXOS no compose (não dependem de interpolação do shell
      # do runner). No `command` abaixo as variáveis usam $$ para o shell do
      # container expandir a partir desta env.
      - DOMAIN=siscom.casalm.com.br
      - CERTBOT_EMAIL=contato@casalm.com.br
    entrypoint: /bin/sh
    command: >
      -c '
        while [ ! -f /etc/cloudflare/cloudflare.ini ]; do
          echo "Aguardando credencial: crie /home/jpsantos/siscom/certbot/cloudflare.ini (token Cloudflare Zone:DNS:Edit; ver cloudflare.ini.example)..."
          sleep 30
        done
        if [ ! -d "/etc/letsencrypt/live/$$DOMAIN" ]; then
          certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/cloudflare/cloudflare.ini \
            -d "$$DOMAIN" --email "$$CERTBOT_EMAIL" --agree-tos --no-eff-email --non-interactive
        fi
        trap exit TERM
        while :; do
          certbot renew --non-interactive --quiet
          sleep 12h & wait $${!}
        done
      '
    restart: unless-stopped

volumes:
  postgres-data:
  certbot-etc:
  certbot-www: