# FALLBACK SEM TLS — usado quando o certificado ainda não existe
# (staging, ou produção antes do certbot emitir). Mantém o comportamento
# original: HTTP na porta 80.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Rotas do backend — arquivo ÚNICO compartilhado com o ambiente local.
    include /etc/nginx/snippets/backend-routes.conf;

    # Assets com hash no nome (Vite): imutável é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html e fallback da SPA: SEMPRE revalidam.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}