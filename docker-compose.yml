# Ambiente LOCAL — topologia idêntica à produção (docker-compose.prod.yml):
#   navegador → nginx (frontend) → [ /api,/images,impressões,portal → backend
#                                   / (SPA em dev: Vite com HMR) ]
# Diferenças intencionais vs prod: código montado com reload, APP_VERSION=dev,
# SPA servida pelo Vite atrás do nginx (mesma porta de entrada).
#
# Migrações NÃO aplicam sozinhas (paridade com prod): após criar/alterar algo:
#   docker compose exec -T backend python -m catalog_server.versioning apply --origem local

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalog
      - POSTGRES_DB=catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Apenas na rede Docker, como na produção — o acesso externo entra pelo nginx.
    expose:
      - "8000"
    volumes:
      - ./images:/app/images
      - ./backend/catalog_server:/app/catalog_server
      - ./backend/migrations:/app/migrations
      - ./releases:/app/releases:ro
    environment:
      - FLASK_ENV=development
      - IMAGES_DIR=/app/images
      - APP_VERSION=dev
      # Paridade com produção: migrações por comando explícito (ver cabeçalho).
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; req=urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0 if req.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ─── Processamento assíncrono (P5): Redis + RQ ──────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "catalog_server.jobs.worker"]
    volumes:
      - ./backend/catalog_server:/app/catalog_server
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
      - IMAGES_DIR=/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "catalog_server.jobs.scheduler"]
    volumes:
      - ./backend/catalog_server:/app/catalog_server
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
      - RECHECAGEM_INTERVAL_MIN=15
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # SPA em desenvolvimento (Vite/HMR). Fica SÓ na rede interna: quem fala
  # com o navegador é o nginx abaixo.
  vite:
    build:
      context: frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/public:/app/public
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
      # Windows + Docker Desktop: eventos de arquivo não cruzam o bind mount,
      # então o watcher usa polling (senão HMR/F5 servem cache antigo do Vite).
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine   # mesma versão da produção; sem build local
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/nginx.backend-routes.conf:/etc/nginx/snippets/backend-routes.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      vite:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
