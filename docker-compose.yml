services:
  backend:
    build:
      context: .
      dockerfile: catalog_server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - server-data:/app/catalog_server/data
      - ./images:/app/images
      - ./catalog_server:/app/catalog_server
    environment:
      - FLASK_ENV=development
      - SYSTEM_DB=/app/catalog_server/data/server.db
      - CACHE_DB=/app/catalog_server/data/server_cache.db
      - IMAGES_DIR=/app/images
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  server-data:
