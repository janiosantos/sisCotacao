<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responder Cotação</title>
<style>
  :root{
    --verde:#1db954; --verde-escuro:#179443; --verde-claro:#e6f7ec;
    --cinza:#f4f5f7; --borda:#e2e4e8; --texto:#1f2430; --texto2:#6b7280;
    --verde-wa:#25D366;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--cinza);color:var(--texto);padding:16px}
  .wrap{max-width:760px;margin:0 auto}
  .cabe{margin:0 0 18px}
  .cabe h1{font-size:22px;margin:0 0 4px}
  .cabe .sub{color:var(--texto2);font-size:14px}
  .selo{display:inline-block;background:var(--verde-claro);color:var(--verde-escuro);
        font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:8px}
  .card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:12px}
  .item{display:flex;gap:12px;align-items:flex-start}
  .item img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--borda)}
  .item .nome{font-weight:600;line-height:1.3}
  .item .meta{color:var(--texto2);font-size:13px;margin-top:2px}
  .item .qtd{margin-top:6px;background:var(--verde-claro);display:inline-block;padding:2px 8px;
             border-radius:6px;font-size:12px;font-weight:600;color:var(--verde-escuro)}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .campo label{font-size:12px;color:var(--texto2);display:block;margin-bottom:4px;font-weight:600}
  .campo input{width:100%;padding:9px 10px;border:1px solid var(--borda);border-radius:8px;font-size:15px}
  .campo input:focus{outline:2px solid var(--verde-claro);border-color:var(--verde)}
  .estq{display:flex;gap:8px}
  .estq button{flex:1;padding:9px;border:1px solid var(--borda);border-radius:8px;background:#fff;
               font-weight:600;cursor:pointer;color:var(--texto)}
  .estq button.sim.seleto{background:var(--verde-claro);border-color:var(--verde);color:var(--verde-escuro)}
  .estq button.nao.seleto{background:#fdecec;border-color:#e05d5d;color:#c0392b}
  .rodape{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
  .rodape .meta{color:var(--texto2);font-size:12px}
  button.enviar{background:var(--verde-wa);color:#fff;border:none;padding:14px 22px;border-radius:10px;
                font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:.15s}
  button.enviar:disabled{opacity:.6;cursor:not-allowed}
  .aviso{display:none;background:var(--verde-claro);border:1px solid var(--verde);color:var(--verde-escuro);
         padding:14px;border-radius:10px;text-align:center;font-weight:600;margin-top:14px}
  .aviso.erro{background:#fdecec;border-color:#e05d5d;color:#c0392b}
  .barra{height:6px;background:var(--borda);border-radius:999px;overflow:hidden;margin-bottom:6px}
  .barra span{display:block;height:100%;background:var(--verde);width:0;transition:.3s}
</style>
</head>
<body>
<div class="wrap">
  <div class="cabe">
    <span class="selo" id="seloLoja">Fornecedor</span>
    <h1 id="titulo">Cotação de compra</h1>
    <div class="sub" id="subtitulo"></div>
    <div class="barra" style="margin-top:12px"><span id="preenchimento"></span></div>
  </div>
  <div id="lista"></div>
  <div id="rodape" style="display:none">
    <button class="enviar" id="btnEnviar">Enviar Proposta</button>
  </div>
  <div class="aviso" id="aviso"></div>
</div>

<script>
(function(){
  var token = "{{ token }}";
  var itens = [];
  var respostas = {};

  function fmt(v){ return "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function carregar(){
    fetch("/api/fornecedor/" + token)
      .then(function(r){ if(!r.ok) throw new Error("Link inválido"); return r.json(); })
      .then(function(d){
        document.getElementById("titulo").textContent = "Cotação: " + (d.apelido || "Sem título");
        document.getElementById("subtitulo").textContent = "Olá, " + (d.representante||d.nome) +
          (d.data_limite_retorno ? " · retorno até " + d.data_limite_retorno : "") +
          (d.observacoes ? " · " + d.observacoes : "");
        itens = d.itens;
        renderizar();
      })
      .catch(function(e){
        var av=document.getElementById("aviso"); av.className="aviso erro";
        av.style.display="block"; av.textContent=e.message;
      });
  }

  function renderizar(){
    var lista = document.getElementById("lista");
    lista.innerHTML = "";
    itens.forEach(function(it){
      var card = document.createElement("div");
      card.className = "card";
      var img = it.imagem_url ? '<img src="'+it.imagem_url+'">' : '<img src="" style="visibility:hidden">';
      card.innerHTML =
        '<div class="item">' + img +
          '<div style="flex:1">' +
            '<div class="nome">'+it.name+'</div>' +
            '<div class="meta">SKU: '+(it.sku||"—")+(it.brand?' · '+it.brand:'')+'</div>' +
            '<span class="qtd">Quantidade: '+it.quantidade+'</span>' +
            '<div class="campos">' +
              '<div class="campo"><label>Preço unitário (R$)</label><input type="number" step="0.01" min="0" data-c="preco"></div>' +
              '<div class="campo"><label>Desconto (%)</label><input type="number" step="0.5" min="0" max="100" data-c="desconto"></div>' +
              '<div class="campo"><label>Prazo de entrega (dias)</label><input type="number" min="0" data-c="prazo"></div>' +
              '<div class="campo"><label>Estoque</label><div class="estq">' +
                '<button type="button" data-s="1" class="sim seleto">Sim</button>' +
                '<button type="button" data-s="0" class="nao">Não</button>' +
              '</div></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      card.querySelectorAll("input[data-c]").forEach(function(inp){
        inp.addEventListener("input", function(){ guardar(it.cotacao_item_id, inp.dataset.c, inp.value); });
      });
      card.querySelector(".estq button").dataset.estq = "1";
      card.querySelectorAll(".estq button").forEach(function(b){
        b.addEventListener("click", function(){
          card.querySelectorAll(".estq button").forEach(function(x){ x.className=x.dataset.s==="1"?"sim":"nao"; });
          this.className = (this.dataset.s==="1"?"sim":"nao") + " seleto";
          guardar(it.cotacao_item_id, "estoque", Number(this.dataset.s));
        });
      });
      lista.appendChild(card);
    });
    document.getElementById("rodape").style.display="block";
    document.getElementById("preenchimento").style.width = "100%";
  }

  function guardar(cotacao_item_id, campo, valor){
    respostas[cotacao_item_id] = respostas[cotacao_item_id] || {};
    respostas[cotacao_item_id][campo] = valor;
  }

  function validar(){
    var faltando = 0;
    itens.forEach(function(it){ if(!respostas[it.cotacao_item_id] || respostas[it.cotacao_item_id].preco<=0) faltando++; });
    return faltando;
  }

  document.getElementById("btnEnviar").addEventListener("click", function(){
    var faltando = validar();
    if(faltando>0){
      var av=document.getElementById("aviso"); av.className="aviso erro"; av.style.display="block";
      av.textContent="Preencha o preço de " + faltando + " item(ns) antes de enviar.";
      return;
    }
    var precos = itens.map(function(it){
      var r = respostas[it.cotacao_item_id] || {};
      return {
        cotacao_item_id: it.cotacao_item_id,
        preco_unitario: Number(r.preco||0),
        desconto_percentual: Number(r.desconto||0)||0,
        prazo_entrega_dias: Number(r.prazo||0)||0,
        disponibilidade_estoque: (r.estoque===0)?0:1
      };
    });
    var btn=this; btn.disabled=true; btn.textContent="Enviando…";
    fetch("/api/fornecedor/" + token + "/proposta", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ precos: precos })
    }).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||"Erro");}); return r.json(); })
      .then(function(){
        var av=document.getElementById("aviso"); av.className="aviso"; av.style.display="block";
        av.textContent="Proposta enviada com sucesso! A loja foi notificada. Obrigado!";
        document.getElementById("rodape").style.display="none";
      })
      .catch(function(e){
        var av=document.getElementById("aviso"); av.className="aviso erro"; av.style.display="block";
        av.textContent=e.message; btn.disabled=false; btn.textContent="Enviar Proposta";
      });
  });

  carregar();
})();
</script>
</body>
</html>
