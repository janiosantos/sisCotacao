<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Público — Demonstração da API</title>
<style>
  :root{
    --brand:#f97316; --brand-dark:#ea580c; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f9fafb; --card:#ffffff; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink);}
  header{background:#111827; color:#fff; padding:18px 24px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;}
  header h1{font-size:18px; font-weight:600;}
  header small{color:#9ca3af; font-weight:400; font-size:13px;}
  .base{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .base input{font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid #374151; background:#1f2937; color:#e5e7eb; width:260px;}
  .wrap{max-width:1180px; margin:0 auto; padding:20px 16px 60px;}
  .filtros{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
  .filtros input,.filtros select{font-size:14px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff;}
  .filtros input[type=search]{flex:1; min-width:200px;}
  .filtros button{background:var(--brand); color:#fff; border:none; padding:8px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}
  .filtros button:hover{background:var(--brand-dark);}
  .meta{color:var(--muted); font-size:13px; margin-bottom:14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 6px 18px rgba(0,0,0,.10); transform:translateY(-2px);}
  .thumb{height:170px; display:flex; align-items:center; justify-content:center; background:#f3f4f6; padding:8px;}
  .thumb img{max-height:100%; max-width:100%; object-fit:contain;}
  .thumb .ph{color:#9ca3af; font-size:12px;}
  .info{padding:12px; border-top:1px solid var(--line);}
  .info .nome{font-size:13px; font-weight:600; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .info .marca{font-size:12px; color:var(--muted); margin-top:2px;}
  .info .preco{font-size:16px; font-weight:700; color:var(--brand-dark); margin-top:6px;}
  .info .preco .antigo{font-size:12px; color:var(--muted); text-decoration:line-through; font-weight:400; margin-right:6px;}
  .info .cat{font-size:11px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .paginacao{display:flex; gap:8px; justify-content:center; margin-top:20px; align-items:center;}
  .paginacao button{border:1px solid var(--line); background:#fff; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px;}
  .paginacao button:disabled{opacity:.4; cursor:default;}
  .vazio{text-align:center; color:var(--muted); padding:40px 0;}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .overlay.aberto{display:flex;}
  .modal{background:#fff; border-radius:16px; max-width:820px; width:100%; max-height:92vh; overflow:auto; padding:20px;}
  .modal .fechar{float:right; border:none; background:#f3f4f6; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;}
  .modal h2{font-size:18px; margin-bottom:2px;}
  .galeria{display:flex; gap:12px; margin:14px 0; overflow-x:auto; padding-bottom:6px;}
  .galeria img{height:120px; border:1px solid var(--line); border-radius:8px; object-fit:contain; background:#f9fafb;}
  .galeria img.principal{border-color:var(--brand); box-shadow:0 0 0 2px rgba(249,115,22,.35);}
  .detalhe-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:10px;}
  .detalhe-grid div{background:#f9fafb; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .detalhe-grid .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .detalhe-grid .v{font-size:14px; font-weight:600; margin-top:2px;}
  .descricao{margin-top:14px; font-size:14px; line-height:1.5; color:#374151;}
  .espec{margin-top:10px; font-size:13px; color:var(--muted);}
  .erro{color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:13px;}
  .carregando{text-align:center; color:var(--muted); padding:30px 0;}
</style>
</head>
<body>
<header>
  <h1>🛒 Catálogo Público <small>exemplo de consumo da API /api/publico/*</small></h1>
  <div class="base">
    <label for="base" style="font-size:12px;color:#9ca3af">Base da API:</label>
    <input id="base" value="" placeholder="https://seusite.com.br (vazio = mesma origem)">
    <button onclick="aplicarBase()" style="background:var(--brand);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer">Aplicar</button>
  </div>
</header>

<div class="wrap">
  <div id="erroBox" class="erro" style="display:none"></div>

  <div class="filtros">
    <input id="q" type="search" placeholder="Buscar produto (nome, marca, especificação)…">
    <select id="cat"></select>
    <select id="subcat"></select>
    <select id="marca"></select>
    <button onclick="buscar()">Buscar</button>
  </div>

  <div class="meta" id="meta">Carregando…</div>
  <div id="grid" class="grid"><div class="carregando">Carregando produtos…</div></div>

  <div class="paginacao">
    <button id="prev" onclick="mudarPag(-1)">← Anterior</button>
    <span id="pagina" style="font-size:14px">—</span>
    <button id="next" onclick="mudarPag(1)">Próxima →</button>
  </div>
</div>

<div id="overlay" class="overlay" onclick="if(event.target===this)fechar()">
  <div class="modal">
    <button class="fechar" onclick="fechar()">✕</button>
    <div id="det"></div>
  </div>
</div>

<script>
"use strict";
let BASE = (window.location.origin || "").replace(/\/$/, "");
let offset = 0, total = 0, LIMIT = 24;
let categorias = {};   // categoria -> [subcategorias]
let produtosCache = {}; // id -> produto

function api(path){
  return fetch(BASE + path).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function imgUrl(u){
  if (!u) return "";
  return (u.startsWith("http") || u.startsWith("data:")) ? u : (BASE + u);
}
function fmtBRL(v){
  const n = Number(v || 0);
  return n > 0 ? n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}) : "Sob consulta";
}
function aplicarBase(){
  const v = document.getElementById("base").value.trim().replace(/\/$/,"");
  BASE = v || (window.location.origin || "").replace(/\/$/, "");
  offset = 0;
  carregar();
}
function erro(msg){
  const el = document.getElementById("erroBox");
  el.style.display = msg ? "block" : "none";
  el.textContent = msg || "";
}

async function carregarFiltros(){
  try {
    const [cats, marcas] = await Promise.all([
      api("/api/publico/categorias"),
      api("/api/publico/marcas"),
    ]);
    categorias = cats || {};
    const selCat = document.getElementById("cat");
    selCat.innerHTML = '<option value="">Todas as categorias</option>';
    for (const c of Object.keys(categorias).sort()) {
      const o = document.createElement("option");
      o.value = c; o.textContent = c; selCat.appendChild(o);
    }
    const selMar = document.getElementById("marca");
    selMar.innerHTML = '<option value="">Todas as marcas</option>';
    for (const m of (marcas.marcas || [])) {
      const o = document.createElement("option");
      o.value = m; o.textContent = m; selMar.appendChild(o);
    }
    document.getElementById("cat").addEventListener("change", atualizarSubcat);
  } catch (e) {
    erro("Falha ao carregar filtros: " + e.message);
  }
}
function atualizarSubcat(){
  const cat = document.getElementById("cat").value;
  const selSub = document.getElementById("subcat");
  selSub.innerHTML = '<option value="">Todas as subcategorias</option>';
  if (cat && categorias[cat]) {
    for (const s of categorias[cat]) {
      const o = document.createElement("option");
      o.value = s; o.textContent = s; selSub.appendChild(o);
    }
  }
  buscar();
}
function qs(){
  const p = new URLSearchParams();
  const q = document.getElementById("q").value.trim();
  const cat = document.getElementById("cat").value;
  const sub = document.getElementById("subcat").value;
  const mar = document.getElementById("marca").value;
  if (q) p.set("q", q);
  if (cat) p.set("categoria", cat);
  if (sub) p.set("subcategoria", sub);
  if (mar) p.set("marca", mar);
  p.set("limit", String(LIMIT));
  p.set("offset", String(offset));
  return p.toString();
}
function buscar(){ offset = 0; carregar(); }
function mudarPag(d){ offset += d * LIMIT; carregar(); }

async function carregar(){
  erro("");
  const grid = document.getElementById("grid");
  grid.innerHTML = '<div class="carregando">Carregando produtos…</div>';
  try {
    const data = await api("/api/publico/produtos?" + qs());
    total = data.total || 0;
    document.getElementById("meta").textContent =
      total.toLocaleString("pt-BR") + " produto(s) encontrado(s)" +
      (offset > 0 ? " — mostrando " + (offset+1) + " a " + Math.min(offset+LIMIT, total) : "");
    document.getElementById("prev").disabled = offset <= 0;
    document.getElementById("next").disabled = offset + LIMIT >= total;
    const pag = Math.floor(offset / LIMIT) + 1;
    const pagMax = Math.max(1, Math.ceil(total / LIMIT));
    document.getElementById("pagina").textContent = pag + " / " + pagMax;

    if (!data.items.length) {
      grid.innerHTML = '<div class="vazio">Nenhum produto encontrado.</div>';
      return;
    }
    grid.innerHTML = "";
    for (const p of data.items) {
      grid.appendChild(card(p));
    }
  } catch (e) {
    grid.innerHTML = "";
    erro("Falha ao carregar produtos: " + e.message);
  }
}

function card(p){
  const div = document.createElement("div");
  div.className = "card";
  const img = p.imagem_url
    ? `<img src="${imgUrl(p.imagem_url)}" loading="lazy" alt="" onerror="this.parentNode.innerHTML='<span class=&quot;ph&quot;>sem imagem</span>'">`
    : '<span class="ph">sem imagem</span>';
  const preco = (p.preco_promocional)
    ? `<span class="antigo">${fmtBRL(p.preco)}</span><span>${fmtBRL(p.preco_promocional)}</span>`
    : fmtBRL(p.preco);
  div.innerHTML =
    `<div class="thumb">${img}</div>` +
    `<div class="info"><div class="nome">${escapeHtml(p.nome || "")}</div>` +
    `<div class="marca">${escapeHtml(p.marca || "")}</div>` +
    `<div class="preco">${preco}</div>` +
    `<div class="cat">${escapeHtml([p.categoria, p.subcategoria].filter(Boolean).join(" › "))}</div></div>`;
  div.onclick = () => detalhe(p.id);
  return div;
}

async function detalhe(id){
  const overlay = document.getElementById("overlay");
  const det = document.getElementById("det");
  det.innerHTML = '<div class="carregando">Carregando…</div>';
  overlay.classList.add("aberto");
  document.body.style.overflow = "hidden";
  try {
    let p = produtosCache[id] || await api("/api/publico/produtos/" + id);
    produtosCache[id] = p;
    const gal = (p.imagens && p.imagens.length)
      ? '<div class="galeria">' + p.imagens.map((u,i) =>
          `<img src="${imgUrl(u)}" class="${i===0?'principal':''}" alt=""></img>`).join("") + '</div>'
      : '<div class="galeria"><span class="ph">Sem imagens</span></div>';
    const promo = (p.preco_promocional)
      ? `<div class="k">Preço promocional</div><div class="v">${fmtBRL(p.preco_promocional)}</div>`
      : "";
    det.innerHTML =
      `<h2>${escapeHtml(p.nome || "")}</h2>` +
      `<div class="marca">${escapeHtml(p.marca || "")}</div>` +
      gal +
      `<div class="detalhe-grid">` +
        `<div><div class="k">Preço</div><div class="v">${fmtBRL(p.preco)}</div></div>` +
        (promo ? `<div>${promo}</div>` : "") +
        `<div><div class="k">Categoria</div><div class="v">${escapeHtml(p.categoria || "—")}</div></div>` +
        `<div><div class="k">Subcategoria</div><div class="v">${escapeHtml(p.subcategoria || "—")}</div></div>` +
        `<div><div class="k">SKU</div><div class="v">${escapeHtml(p.sku || "—")}</div></div>` +
        `<div><div class="k">EAN</div><div class="v">${escapeHtml(p.ean || "—")}</div></div>` +
        `<div><div class="k">Unidade</div><div class="v">${escapeHtml(p.unidade_venda || "—")}</div></div>` +
      `</div>` +
      (p.descricao ? `<div class="descricao">${escapeHtml(p.descricao)}</div>` : "") +
      (p.especificacoes ? `<div class="espec">Especificações: ${escapeHtml(p.especificacoes)}</div>` : "");
  } catch (e) {
    det.innerHTML = '<div class="erro">Falha ao carregar o produto: ' + escapeHtml(e.message) + '</div>';
  }
}
function fechar(){
  document.getElementById("overlay").classList.remove("aberto");
  document.body.style.overflow = "";
}
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });

carregarFiltros();
carregar();
</script>
</body>
</html>
