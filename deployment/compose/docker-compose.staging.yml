# STAGING ad-hoc — valida a branch em paralelo à produção, sem tocá-la:
#   - projeto próprio (siscom-staging): containers/rede/volume de banco exclusivos
#   - banco NASCE VAZIO e é migrado pelo pipeline (teste real da cadeia fresca)
#   - imagens com sufixo -staging (não sobrescrevem as tags usadas pela produção)
#   - frontend publicado em :8081 (produção segue em :80)
# Uso: workflow "Deploy Staging" ou manual:
#   COMPOSE_PROJECT_NAME=siscom-staging docker compose -f deployment/compose/docker-compose.staging.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalog
      - POSTGRES_DB=catalog
    # Sem porta publicada: o banco de staging fica só na rede interna dele.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: siscom-backend-staging:${APP_VERSION:?APP_VERSION obrigatório}
    build:
      # Paths em um compose são relativos AO PRÓPRIO ARQUIVO — daqui,
      # a raiz do repositório fica em ../..
      context: ../..
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    volumes:
      - /home/jpsantos/siscom/img-staging:/app/images
      - ../../releases:/app/releases:ro
    environment:
      - IMAGES_DIR=/app/images
      - CATALOG_HOST=0.0.0.0
      - CATALOG_ENV=staging
      - CATALOG_SECRET=${CATALOG_STAGING_SECRET:?CATALOG_STAGING_SECRET obrigatório}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_STAGING_WEBHOOK_SECRET:?PAYMENT_STAGING_WEBHOOK_SECRET obrigatório}
      - APP_VERSION=${APP_VERSION:-rc}
      - AUTO_MIGRATE=0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
      - PUBLIC_CORS_ORIGINS=https://casalm.com.br,https://www.casalm.com.br,https://siscom.casalm.com.br:444,http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; req=urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0 if req.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: siscom-frontend-staging:${APP_VERSION:?APP_VERSION obrigatório}
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8081:80"
      # HTTPS do staging usa o mesmo dominio/certificado e porta TCP dedicada
      # para permitir webhooks externos sem tocar na porta 443 da producao.
      - "444:443"
    volumes:
      - siscom_certbot-etc:/etc/letsencrypt:ro
    environment:
      - DOMAIN=siscom.casalm.com.br
      - NGINX_MODE=staging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ -T 5 2>/dev/null && wget --no-check-certificate -qO /dev/null https://127.0.0.1/ -T 5 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Processamento assíncrono (P5): Redis + RQ
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: siscom-backend-staging:${APP_VERSION:?APP_VERSION obrigatório}
    command: ["python", "-u", "-m", "catalog_server.jobs.worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
      - IMAGES_DIR=/app/images
      - CATALOG_ENV=staging
      - CATALOG_SECRET=${CATALOG_STAGING_SECRET:?CATALOG_STAGING_SECRET obrigatório}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_STAGING_WEBHOOK_SECRET:?PAYMENT_STAGING_WEBHOOK_SECRET obrigatório}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: siscom-backend-staging:${APP_VERSION:?APP_VERSION obrigatório}
    command: ["python", "-u", "-m", "catalog_server.jobs.scheduler"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://catalog:catalog@db:5432/catalog
      - CATALOG_ENV=staging
      - CATALOG_SECRET=${CATALOG_STAGING_SECRET:?CATALOG_STAGING_SECRET obrigatório}
      - RECHECAGEM_INTERVAL_MIN=15
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  # Compartilhamento intencional somente-leitura: o staging usa o mesmo
  # certificado do dominio, mas permanece isolado por projeto e porta TCP.
  siscom_certbot-etc:
    external: true
