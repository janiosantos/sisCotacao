server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Rotas do backend — arquivo ÚNICO compartilhado com o ambiente local
    # (montado em /etc/nginx/snippets/ pelo Dockerfile.prod e pelo compose local).
    include /etc/nginx/snippets/backend-routes.conf;

    # Assets com hash no nome (Vite): imutável é seguro — conteúdo novo = nome novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html e fallback da SPA: SEMPRE revalidam.
    # Antes isto respondia immutable por 1 ano — "envenenava" no navegador
    # qualquer URL que caísse aqui (ex.: impressões antes do fix de rotas)
    # e escondia deploys novos até hard-refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
