name: Deploy produção (siscom)

# Publicação SOMENTE mediante autorização explícita (Run workflow),
# escolhendo versão e componentes. Não há mais gatilho automático por tag.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da release (ex.: v1.5.1)'
        required: true
        type: string
      componentes:
        description: 'O que publicar'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - backend
          - frontend
          - schema

# O runner e o daemon Docker sao compartilhados com staging. Serializar os
# workflows protege build, tagging, migracao e limpeza de cache.
concurrency:
  group: siscom-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Executa no self-hosted runner instalado no próprio servidor de produção.
    runs-on: [self-hosted, siscom-prod]
    env:
      COMPOSE_PROJECT_NAME: siscom   # mantém o volume siscom_postgres-data (dados intactos)
      # Credenciais exigidas pelo docker-compose.prod.yml (senha do volume atual = catalog).
      # Configure em Settings → Secrets: POSTGRES_USER=catalog, POSTGRES_PASSWORD=catalog,
      # CATALOG_SECRET=<segredo aleatório>. Sem CATALOG_SECRET o deploy falha (fail-safe).
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CATALOG_SECRET: ${{ secrets.CATALOG_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Define componentes do deploy
        id: comp
        run: |
          C="${{ inputs.componentes }}"
          if [ -z "$C" ]; then C="todos"; fi   # push de tag publica tudo
          echo "componentes=$C" >> "$GITHUB_OUTPUT"
          # schema implica rebuild do backend: as migrações vivem na imagem.
          case "$C" in
            todos)    B=true;  F=true;  M=true  ;;
            backend)  B=true;  F=false; M=true  ;;
            schema)   B=true;  F=false; M=true  ;;
            frontend) B=false; F=true;  M=false ;;
            *) echo "componentes inválidos: $C"; exit 1 ;;
          esac
          echo "backend=$B"  >> "$GITHUB_OUTPUT"
          echo "frontend=$F" >> "$GITHUB_OUTPUT"
          echo "migracoes=$M" >> "$GITHUB_OUTPUT"

      - name: Resolve versão da imagem
        id: version
        run: |
          V="${{ inputs.versao }}"
          if [ -z "$V" ]; then V="$(git describe --tags --always 2>/dev/null || echo dev)"; fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Preflight de espaco do Docker
        run: |
          # Nao remove containers, volumes ou imagens versionadas.
          docker builder prune --all --force --filter 'until=24h'
          docker image prune --force
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            docker builder prune --all --force
            DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          fi
          df -h "$DOCKER_ROOT"
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            echo "ERRO: menos de 4 GiB livres no filesystem do Docker."
            exit 1
          fi
          docker compose -f deployment/compose/docker-compose.prod.yml config --quiet

      - name: Salva imagem atual (para rollback)
        if: steps.comp.outputs.backend == 'true'
        run: docker tag siscom-backend:latest siscom-backend:prev || true

      - name: Build imagem do backend
        if: steps.comp.outputs.backend == 'true'
        run: docker compose -f deployment/compose/docker-compose.prod.yml build backend

      - name: Build imagem do frontend
        if: steps.comp.outputs.frontend == 'true'
        run: docker compose -f deployment/compose/docker-compose.prod.yml build frontend

      - name: Backup de segurança (somente se houver migration pendente)
        if: steps.comp.outputs.migracoes == 'true'
        run: |
          mkdir -p /home/jpsantos/siscom/backups
          # A checagem usa a imagem NOVA, pois a imagem atualmente em execucao
          # ainda nao conhece as migrations desta release.
          PENDING=$(docker compose -f deployment/compose/docker-compose.prod.yml run --rm --no-deps backend \
                      python -m migrations check 2>/dev/null \
                      | sed -n 's/.*pendentes: \([0-9]*\).*/\1/p')
          if [ -z "$PENDING" ]; then
            echo "ERRO: nao foi possivel determinar as migrations pendentes."
            exit 1
          fi
          echo "migrações pendentes: $PENDING"
          if [ "$PENDING" != "0" ]; then
            docker compose -f deployment/compose/docker-compose.prod.yml exec -T db \
              pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB:-catalog}" -Fc \
              > "/home/jpsantos/siscom/backups/prod-pre-$(date +%Y%m%d-%H%M%S).dump"
            echo "backup de segurança criado em /home/jpsantos/siscom/backups/"
          else
            echo "sem migrations pendentes; pulando backup"
          fi

      # Regra 03: release imutável — além do latest, cada versão fica etiquetada
      # para diagnóstico e rollback pontual (qualquer tag, não só prev).
      # A build do compose ja etiqueta o componente alterado com a versao. Para
      # releases parciais, o componente nao alterado recebe um alias imutavel da
      # imagem atual para que `compose up` nunca tente buscar uma tag inexistente.
      - name: Etiqueta imagens com a versão da release
        run: |
          if [ "${{ steps.comp.outputs.backend }}" = "true" ]; then
            docker tag "siscom-backend:${{ steps.version.outputs.tag }}" siscom-backend:latest
          else
            docker tag siscom-backend:latest "siscom-backend:${{ steps.version.outputs.tag }}"
          fi
          if [ "${{ steps.comp.outputs.frontend }}" = "true" ]; then
            docker tag "siscom-frontend:${{ steps.version.outputs.tag }}" siscom-frontend:latest
          else
            docker tag siscom-frontend:latest "siscom-frontend:${{ steps.version.outputs.tag }}"
          fi

      - name: Para o backend (janela de manutenção — DDL sem tráfego)
        if: steps.comp.outputs.migracoes == 'true'
        run: docker compose -f deployment/compose/docker-compose.prod.yml stop backend worker scheduler impressao-worker

      - name: Aplica migrações pendentes (container one-off com a imagem nova)
        if: steps.comp.outputs.migracoes == 'true'
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml run --rm --no-deps backend \
            python -m catalog_server.versioning apply --origem deploy

      - name: Deploy (sobe containers)
        run: docker compose -f deployment/compose/docker-compose.prod.yml up -d

      - name: Health gate - migrações + backend
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml exec -T backend \
            python -m migrations status
          for i in $(seq 1 30); do
            if curl -ksfSL https://localhost/api/health >/dev/null 2>&1 \
               || curl -ksfSL http://localhost/api/health >/dev/null 2>&1; then
              echo "backend OK"; exit 0
            fi
            sleep 3
          done
          echo "backend não subiu após deploy"; \
            docker compose -f deployment/compose/docker-compose.prod.yml logs backend; exit 1

      - name: Health gate - worker de impressão
        run: |
          for i in $(seq 1 10); do
            if docker compose -f deployment/compose/docker-compose.prod.yml exec -T impressao-worker python -c \
              "from catalog_server.services.impressao import impressao_service; impressao_service.status(); print('impressao-worker OK')"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deployment/compose/docker-compose.prod.yml ps impressao-worker
          docker compose -f deployment/compose/docker-compose.prod.yml logs --tail=100 impressao-worker
          exit 1

      # Regra 12: smoke pós-deploy — falha em qualquer checagem falha o deploy.
      - name: Smoke tests
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: bash deployment/scripts/smoke.sh http://localhost

      # Toda publicação gera registro no Histórico — independe do componente.
      # Manifestos cujos componentes estão contidos no escopo publicado fecham.
      - name: Registra releases publicadas (histórico)
        run: |
          docker compose -f deployment/compose/docker-compose.prod.yml exec -T backend \
            python -m catalog_server.versioning publicar \
            --componentes "${{ steps.comp.outputs.componentes }}"

      - name: Limpa imagens órfãs
        if: always()
        run: docker image prune -f
