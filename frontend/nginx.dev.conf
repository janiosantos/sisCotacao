# nginx do ambiente LOCAL — espelha a topologia de produção:
# única porta de entrada; SPA vem do Vite (HMR) atrás deste proxy.
# As rotas de backend são as MESMAS da produção (arquivo compartilhado),
# montado pelo docker-compose.yml em /etc/nginx/snippets/backend-routes.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/backend-routes.conf;

    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # HMR mantém WebSocket aberto por muito tempo.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
