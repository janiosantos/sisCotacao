name: Deploy produção (siscom)

# Publicação SOMENTE mediante autorização explícita (Run workflow),
# escolhendo versão e componentes. Não há mais gatilho automático por tag.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da release (ex.: v1.5.1)'
        required: true
        type: string
      componentes:
        description: 'O que publicar'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - backend
          - frontend
          - schema

jobs:
  deploy:
    # Executa no self-hosted runner instalado no próprio servidor de produção.
    runs-on: [self-hosted, siscom-prod]
    env:
      COMPOSE_PROJECT_NAME: siscom   # mantém o volume siscom_postgres-data (dados intactos)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define componentes do deploy
        id: comp
        run: |
          C="${{ inputs.componentes }}"
          if [ -z "$C" ]; then C="todos"; fi   # push de tag publica tudo
          echo "componentes=$C" >> "$GITHUB_OUTPUT"
          # schema implica rebuild do backend: as migrações vivem na imagem.
          case "$C" in
            todos)    B=true;  F=true;  M=true  ;;
            backend)  B=true;  F=false; M=true  ;;
            schema)   B=true;  F=false; M=true  ;;
            frontend) B=false; F=true;  M=false ;;
            *) echo "componentes inválidos: $C"; exit 1 ;;
          esac
          echo "backend=$B"  >> "$GITHUB_OUTPUT"
          echo "frontend=$F" >> "$GITHUB_OUTPUT"
          echo "migracoes=$M" >> "$GITHUB_OUTPUT"

      - name: Resolve versão da imagem
        id: version
        run: |
          V="${{ inputs.versao }}"
          if [ -z "$V" ]; then V="$(git describe --tags --always 2>/dev/null || echo dev)"; fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Backup de segurança (somente se houver migration pendente)
        if: steps.comp.outputs.migracoes == 'true'
        run: |
          mkdir -p /home/jpsantos/siscom/backups
          PENDING=$(docker compose -f docker-compose.prod.yml exec -T backend \
                      python -m scripts.pg_migrations check 2>/dev/null \
                      | sed -n 's/.*pendentes: \([0-9]*\).*/\1/p')
          echo "migrações pendentes: ${PENDING:-0}"
          if [ "${PENDING:-0}" != "0" ]; then
            docker compose -f docker-compose.prod.yml exec -T db pg_dump -U catalog -d catalog -Fc \
              > "/home/jpsantos/siscom/backups/prod-pre-$(date +%Y%m%d-%H%M%S).dump"
            echo "backup de segurança criado em /home/jpsantos/siscom/backups/"
          else
            echo "sem migrations pendentes; pulando backup"
          fi

      - name: Salva imagem atual (para rollback)
        if: steps.comp.outputs.backend == 'true'
        run: docker tag siscom-backend:latest siscom-backend:prev || true

      - name: Build imagem do backend
        if: steps.comp.outputs.backend == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: docker compose -f docker-compose.prod.yml build backend

      - name: Build imagem do frontend
        if: steps.comp.outputs.frontend == 'true'
        run: docker compose -f docker-compose.prod.yml build frontend

      - name: Para o backend (janela de manutenção — DDL sem tráfego)
        if: steps.comp.outputs.migracoes == 'true'
        run: docker compose -f docker-compose.prod.yml stop backend

      - name: Aplica migrações pendentes (container one-off com a imagem nova)
        if: steps.comp.outputs.migracoes == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          docker compose -f docker-compose.prod.yml run --rm backend \
            python -m catalog_server.versioning apply --origem deploy

      - name: Deploy (sobe containers)
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Health gate - migrações + backend
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend \
            python -m scripts.pg_migrations status
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health >/dev/null 2>&1; then
              echo "backend OK"; exit 0
            fi
            sleep 3
          done
          echo "backend não subiu após deploy"; \
            docker compose -f docker-compose.prod.yml logs backend; exit 1

      # Toda publicação gera registro no Histórico — independe do componente.
      # Manifestos cujos componentes estão contidos no escopo publicado fecham.
      - name: Registra releases publicadas (histórico)
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend \
            python -m catalog_server.versioning publicar \
            --componentes "${{ steps.comp.outputs.componentes }}"

      - name: Limpa imagens órfãs
        if: always()
        run: docker image prune -f
