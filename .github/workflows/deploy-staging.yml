name: Deploy Staging (siscom)
run-name: Staging ${{ inputs.incremento }} @ ${{ github.ref_name }} (${{ inputs.modo }})

# Valida uma branch em ambiente paralelo à produção, no próprio servidor:
# projeto Docker separado (siscom-staging), banco vazio que nasce e é
# migrado pelo pipeline, frontend em :8081. Nada da produção é tocado.
on:
  workflow_dispatch:
    inputs:
      incremento:
        description: 'Incremento em relação à última versão publicada'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      modo:
        description: 'rápido pula as suítes de teste (iteração); completo roda o CI'
        required: true
        default: 'completo'
        type: choice
        options:
          - rapido
          - completo

permissions:
  contents: write

# Staging e producao compartilham o mesmo runner/daemon Docker. Nunca executa
# builds ou limpezas concorrentes com o workflow de producao.
concurrency:
  group: siscom-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: [self-hosted, siscom-prod]
    env:
      COMPOSE_PROJECT_NAME: siscom-staging
      COMPOSE_FILE: deployment/compose/docker-compose.staging.yml
      CATALOG_STAGING_SECRET: ${{ secrets.CATALOG_STAGING_SECRET }}
      PAYMENT_STAGING_WEBHOOK_SECRET: ${{ secrets.PAYMENT_STAGING_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Valida release e define identificação do build
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.incremento }}
          DEPLOY_MODE: ${{ inputs.modo }}
        run: |
          RELEASE_VERSION="$(python scripts/release_control.py next --bump "$RELEASE_BUMP")"
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "ERRO: a versão final $RELEASE_VERSION já possui tag e não pode ser reutilizada."
            exit 1
          fi
          MANIFEST="releases/$RELEASE_VERSION.json"
          python - "$MANIFEST" "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          if not path.is_file():
              raise SystemExit(f"ERRO: manifesto obrigatório não encontrado: {path}")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("versao") != version:
              raise SystemExit(f"ERRO: manifesto declara {data.get('versao')!r}, esperado {version!r}")
          components = data.get("componentes")
          if not isinstance(components, list) or not components:
              raise SystemExit("ERRO: manifesto deve declarar ao menos um componente")
          allowed = {"backend", "frontend", "schema", "deployment"}
          unknown = sorted(set(components) - allowed)
          if unknown:
              raise SystemExit(f"ERRO: componentes sem deploy neste pipeline: {', '.join(unknown)}")
          selected = set(components)
          images = data.get("imagens") or {}
          if selected & {"backend", "schema", "deployment"}:
              if images.get("backend") != f"siscom-backend:{version}":
                  raise SystemExit("ERRO: tag da imagem backend no manifesto não corresponde à versão")
          if selected & {"frontend", "deployment"}:
              if images.get("frontend") != f"siscom-frontend:{version}":
                  raise SystemExit("ERRO: tag da imagem frontend no manifesto não corresponde à versão")
          PY

          RC_TAG="$RELEASE_VERSION-rc.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          if [ "$DEPLOY_MODE" = "completo" ]; then
            APP_VERSION="$RC_TAG"
          else
            APP_VERSION="$RELEASE_VERSION-dev.$GITHUB_RUN_ID"
          fi
          {
            echo "release_version=$RELEASE_VERSION"
            echo "rc_tag=$RC_TAG"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Incremento selecionado: $RELEASE_BUMP"
          echo "Versão calculada: $RELEASE_VERSION"
          echo "Código candidato: $GITHUB_SHA"
          echo "Imagem de staging: $APP_VERSION"

      - name: Preflight de espaco do Docker
        run: |
          # Remove somente cache de build antigo e imagens sem tag. Containers,
          # volumes e imagens versionadas de producao nao sao removidos.
          docker builder prune --all --force --filter 'until=24h'
          docker image prune --force

          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            echo "Espaco ainda baixo; removendo o restante do cache de build nao utilizado."
            docker builder prune --all --force
            DISPONIVEL_KB="$(df -Pk "$DOCKER_ROOT" | awk 'NR==2 {print $4}')"
          fi
          df -h "$DOCKER_ROOT"
          docker system df
          if [ "${DISPONIVEL_KB:-0}" -lt 4194304 ]; then
            echo "ERRO: menos de 4 GiB livres no filesystem do Docker."
            exit 1
          fi
          docker compose config --quiet

      - name: Build da imagem de testes
        if: github.event.inputs.modo != 'rapido'
        run: |
          CI_IMAGE="siscom-backend:ci-${GITHUB_RUN_ID}"
          echo "CI_BACKEND_IMAGE=$CI_IMAGE" >> "$GITHUB_ENV"
          docker build --quiet --build-arg INSTALL_TEST_DEPS=1 \
            -t "$CI_IMAGE" -f backend/Dockerfile . >/dev/null

      # GATE de CI: a branch não builda nem sobe se os testes falharem.
      # (modo=rapido pula as suítes — iteração rápida; smoke continua como gate).
      - name: Testes (CI) - migrações
        if: github.event.inputs.modo != 'rapido'
        run: bash deployment/scripts/test-migrations.sh

      - name: Testes (CI) - backend
        if: github.event.inputs.modo != 'rapido'
        run: bash deployment/scripts/test-backend.sh

      - name: Testes (CI) - frontend
        if: github.event.inputs.modo != 'rapido'
        run: bash deployment/scripts/test-frontend.sh

      - name: Build das imagens de staging
        run: docker compose build

      - name: Sobe a infraestrutura de staging
        run: docker compose up -d --wait db redis

      - name: Migrações no banco vazio de staging (teste real da cadeia)
        run: |
          docker compose stop backend worker scheduler impressao-worker || true
          docker compose run --rm --no-deps backend \
            python -m catalog_server.versioning apply --origem staging

      - name: Sobe a aplicação de staging
        run: docker compose up -d --wait

      - name: Health gate - staging
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/api/pronto >/dev/null 2>&1; then
              echo "staging OK"; exit 0
            fi
            sleep 3
          done
          echo "staging não subiu"; docker compose logs backend; exit 1

      - name: Health gate - worker de impressão
        run: |
          for i in $(seq 1 10); do
            if docker compose exec -T impressao-worker python -c \
              "from catalog_server.services.impressao import impressao_service; impressao_service.status(); print('impressao-worker OK')"; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps impressao-worker
          docker compose logs --tail=100 impressao-worker
          exit 1

      # Mesma régua de smoke da produção, contra o ambiente de staging.
      - name: Smoke tests
        env:
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: bash deployment/scripts/smoke.sh http://localhost:8081

      # Gate de reconciliação: saldos divergentes dos movimentos falham o staging.
      - name: Gate - reconciliação de estoque
        run: bash deployment/scripts/check-reconciliacao.sh

      - name: Publica tag da release candidate aprovada
        if: github.event.inputs.modo == 'completo'
        env:
          RC_TAG: ${{ steps.release.outputs.rc_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          git config user.name "siscom-release-bot"
          git config user.email "siscom-release-bot@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$RC_TAG" >/dev/null; then
            echo "ERRO: a tag candidata $RC_TAG já existe; a tentativa não é reutilizável."
            exit 1
          fi
          BACKEND_IMAGE="$(docker image inspect --format '{{.Id}}' "siscom-backend-staging:$RC_TAG")"
          FRONTEND_IMAGE="$(docker image inspect --format '{{.Id}}' "siscom-frontend-staging:$RC_TAG")"
          TAG_MESSAGE="$(printf '%s\n%s\n%s\n%s\n%s' \
            "Release candidate $RELEASE_VERSION aprovada no staging" \
            "staging_run_id=$GITHUB_RUN_ID" \
            "staging_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "backend_image=$BACKEND_IMAGE" \
            "frontend_image=$FRONTEND_IMAGE")"
          git tag -a "$RC_TAG" "$GITHUB_SHA" -m "$TAG_MESSAGE"
          git push origin "refs/tags/$RC_TAG"
          {
            echo "## Release candidate aprovada"
            echo ""
            echo "- **Tag para produção:** \`$RC_TAG\`"
            echo "- **Commit validado:** \`$GITHUB_SHA\`"
            echo "- **Imagem backend:** \`$BACKEND_IMAGE\`"
            echo "- **Imagem frontend:** \`$FRONTEND_IMAGE\`"
            echo "- **Versão final planejada:** \`$RELEASE_VERSION\`"
            echo ""
            echo "Abra **Actions > Deploy produção (siscom)** e clique em **Run workflow**."
            echo "A candidata aprovada mais recente será selecionada automaticamente, sem digitação."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registra execução rápida como não promovível
        if: github.event.inputs.modo == 'rapido'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          {
            echo "## Staging rápido concluído"
            echo ""
            echo "A versão \`$RELEASE_VERSION\` **não recebeu tag candidata**, pois as suítes completas foram ignoradas."
            echo "Execute novamente em modo \`completo\` antes de promover para produção."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpa imagens órfãs
        if: always()
        run: |
          if [ -n "${CI_BACKEND_IMAGE:-}" ]; then
            docker image rm "$CI_BACKEND_IMAGE" >/dev/null 2>&1 || true
          fi
          docker image prune -f || true
